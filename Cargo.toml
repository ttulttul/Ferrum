[workspace]
members = [".", "agentd"]

[package]
name = "t3code-server"
version = "0.1.0"
edition = "2021"
description = "Headless Rust orchestration server for T3 Code"
license = "MIT"
repository = "https://github.com/ttulttul/Ferrum"

[features]
default = ["native"]
# The full server: sockets, processes, PTYs, SQLite and the local filesystem.
native = [
    "dep:fff-search",
    "dep:ignore",
    "dep:icu_collator",
    "dep:async-compression",
    "dep:httpdate",
    "dep:mime_guess",
    "dep:tokio-util",
    "dep:hostname",
    "dep:if-addrs",
    "dep:rusqlite",
    "dep:rustix",
    "dep:pulldown-cmark",
    "dep:scraper",
    "dep:tokio-tungstenite",
    "dep:portable-pty",
    "dep:clap",
    "dep:tracing-subscriber",
    "tokio/full",
    "axum/default",
    "axum/ws",
    "reqwest/rustls-tls",
]
# The control plane built for wasm32-unknown-unknown (see workers/). Only the
# platform-neutral modules compile.
workers = ["getrandom/js", "uuid/js", "time/wasm-bindgen"]

[[bin]]
name = "t3code-server"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
ignore = { version = "0.4", optional = true }
fff-search = { version = "=0.11.0", optional = true }
icu_collator = { version = "2", optional = true }
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli"], optional = true }
httpdate = { version = "1", optional = true }
mime_guess = { version = "2", optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
anyhow = "1"
base64 = "0.22"
hostname = { version = "0.4", optional = true }
if-addrs = { version = "0.15", optional = true }
hmac = "0.12"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
getrandom = "0.2"
rusqlite = { version = "0.38", features = ["bundled"], optional = true }
rand = "0.8"
regex = "1"
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream"] }
tokio-tungstenite = { version = "0.24", optional = true }
portable-pty = { version = "0.8.1", optional = true }
url = "2.4.1"
percent-encoding = "2"
axum = { version = "=0.7.9", default-features = false, features = ["json", "query", "form", "matched-path", "original-uri", "multipart"] }
clap = { version = "=4.5.23", features = ["derive", "env"], optional = true }
futures-util = "0.3"
hex = "0.4"
indexmap = "=2.7.0"
serde_yaml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value", "float_roundtrip"] }
tokio = { version = "=1.42.0", features = ["sync", "macros", "rt", "time", "io-util"] }
time = { version = "=0.3.36", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
uuid = { version = "=1.11.0", features = ["serde", "v4"] }
unicode-normalization = "0.1"
ryu-js = "1.0.2"
pulldown-cmark = { version = "0.13", default-features = false, optional = true }
scraper = { version = "0.25", default-features = false, optional = true }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.10.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs"], optional = true }
