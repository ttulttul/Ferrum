name: Performance

# Compares the Rust server with the pinned reference after pushes to main, at most once a day (see
# docs/performance.md); records the results on the perf-data branch and refreshes the numbers in
# docs/performance.md. It never runs on pull requests, and it is its own workflow, so it cannot slow
# or block the parity checks.
on:
  push:
    branches: [main]
    # A change to the docs alone changes neither server.
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      force:
        description: Measure even if docs/performance.md changed in the last 24 hours
        type: boolean
        default: false

# One run at a time, queued rather than cancelled: each run adds its results to perf-data.
concurrency:
  group: performance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Measures only when docs/performance.md on main is at least 24 hours old. The document's own
  # commit time is the clock, so the refresh this workflow merges, or a hand edit, restarts it.
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      measure: ${{ steps.age.outputs.measure }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check when docs/performance.md last changed on main
        id: age
        env:
          FORCE: ${{ inputs.force }}
        run: |
          git fetch --quiet origin main
          changed=$(git log -1 --format=%ct origin/main -- docs/performance.md)
          age=$(( $(date +%s) - ${changed:-0} ))
          if [ "$FORCE" = true ]; then
            echo "Measuring: asked to (force)."
            echo "measure=true" >> "$GITHUB_OUTPUT"
          elif [ "$age" -ge 86400 ]; then
            echo "Measuring: docs/performance.md last changed on main $((age / 3600)) hours ago."
            echo "measure=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Performance::Not measuring: docs/performance.md changed on main $((age / 3600)) h $((age % 3600 / 60)) min ago, less than 24 hours."
            echo "measure=false" >> "$GITHUB_OUTPUT"
          fi

  compare:
    name: compare
    needs: gate
    if: needs.gate.outputs.measure == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # Pushes the results to the perf-data branch, and the refreshed docs/performance.md to the
      # perf-docs-update branch, whose pull request it opens and merges.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned public reference
        run: |
          # The commit the parity workflow pins, so both compare the same reference.
          pinned=$(grep -oE 'pingdotgg/t3code\.git [0-9a-f]{40}' .github/workflows/parity.yml | head -n 1 | cut -d' ' -f2)
          test -n "$pinned"
          git init --quiet reference
          git -C reference fetch --depth=1 --no-recurse-submodules https://github.com/pingdotgg/t3code.git "$pinned"
          git -C reference checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - name: Read cache keys
        id: keys
        run: |
          echo "python=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-pnpm-12.14.0-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - id: python
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-python
          key: parity-python-ubuntu-24.04-${{ steps.keys.outputs.python }}-${{ hashFiles('scripts/parity-requirements.txt') }}
      - name: Build the reference's production bundle
        env:
          PYTHON_CACHED: ${{ steps.python.outputs.cache-hit }}
        run: |
          npm install --global pnpm@12.14.0
          pnpm --dir reference --filter t3 --filter t3code-relay --filter @t3tools/client-runtime install --frozen-lockfile --prefer-offline
          # pnpm 12 completes the workspace install on the first `exec`.
          pnpm --dir reference --filter t3 exec node --version
          # What `t3 serve` runs: apps/server/dist/bin.mjs, bundled as the release does it.
          (cd reference/apps/server && node --run build:bundle)
          test -f reference/apps/server/dist/bin.mjs
          if [ "$PYTHON_CACHED" != true ]; then
            python3 -m venv "$RUNNER_TEMP/parity-python"
            "$RUNNER_TEMP/parity-python/bin/pip" install -r scripts/parity-requirements.txt
          fi
          echo "$RUNNER_TEMP/parity-python/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: performance-release
      - name: Build the Rust server (release)
        run: cargo build --locked --release
      - name: Compare both servers
        id: compare
        run: |
          # The idle-CPU gate's verdict is kept for the last step, so a run over the limit is
          # still recorded on perf-data before the job fails.
          gate=0
          python3 scripts/perf_compare.py \
            --original-command "node $GITHUB_WORKSPACE/reference/apps/server/dist/bin.mjs" \
            --rust-command "$GITHUB_WORKSPACE/target/release/t3code-server" \
            --reference-root "$GITHUB_WORKSPACE/reference" \
            --max-large-idle-cpu 3 \
            --json "$RUNNER_TEMP/perf.json" --markdown "$RUNNER_TEMP/perf.md" || gate=$?
          test -s "$RUNNER_TEMP/perf.json"
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          {
            echo "## Rust server against the reference"
            echo
            cat "$RUNNER_TEMP/perf.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the results
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.sha }}
          path: |
            ${{ runner.temp }}/perf.json
            ${{ runner.temp }}/perf.md
      # Results go to the perf-data branch, one file per commit, with a README.md of the latest
      # numbers and the trend. This step commits nothing to main (the next step's pull request
      # brings only docs/performance.md there), and a push to perf-data triggers no workflow.
      - name: Record the results on perf-data
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          name="$(date -u +%Y-%m-%dT%H%M%SZ)-${SHA:0:12}.json"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/perf-data"
            if git ls-remote --exit-code --heads "$remote" perf-data > /dev/null; then
              git clone --quiet --depth 1 --branch perf-data "$remote" "$RUNNER_TEMP/perf-data"
            else
              git init --quiet -b perf-data "$RUNNER_TEMP/perf-data"
              git -C "$RUNNER_TEMP/perf-data" remote add origin "$remote"
            fi
            mkdir -p "$RUNNER_TEMP/perf-data/results"
            cp "$RUNNER_TEMP/perf.json" "$RUNNER_TEMP/perf-data/results/$name"
            python3 scripts/perf_compare.py --history "$RUNNER_TEMP/perf-data/results" \
              --markdown "$RUNNER_TEMP/perf-data/README.md"
            git -C "$RUNNER_TEMP/perf-data" add README.md results
            git -C "$RUNNER_TEMP/perf-data" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Performance results for ${SHA:0:12}"
            if git -C "$RUNNER_TEMP/perf-data" push --quiet origin perf-data; then
              exit 0
            fi
            echo "::warning::perf-data moved on; trying again."
            sleep $((attempt * 5))
          done
          exit 1
      # The Headline section of docs/performance.md, rewritten from the results, reaches main through a
      # pull request (main's ruleset takes changes only through one), which this job merges at once:
      # the repository has no auto-merge, and nothing needs to check a docs-only change (#283). The
      # merge is pushed with the GITHUB_TOKEN, which starts no workflow run, and this workflow ignores
      # docs/ anyway, so there is no loop. Opening the pull request needs "Allow GitHub Actions to
      # create and approve pull requests"; without it, this step only warns.
      - name: Refresh docs/performance.md on main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          branch=perf-docs-update
          # From the newest main, so the pull request changes nothing but the numbers.
          git fetch --quiet "$remote" main
          git checkout --quiet -B "$branch" FETCH_HEAD
          python3 scripts/perf_compare.py --history "$RUNNER_TEMP/perf-data/results" --update-doc docs/performance.md
          if git diff --quiet -- docs/performance.md; then
            echo "docs/performance.md is already current."
            exit 0
          fi
          git add docs/performance.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet -m "Refresh the performance numbers from ${SHA:0:12}"
          # The branch is this workflow's own; replace a copy a failed run left behind, but nothing newer.
          current=$(git ls-remote "$remote" "refs/heads/$branch" | cut -f1)
          git push --quiet --force-with-lease="refs/heads/$branch:$current" "$remote" "HEAD:refs/heads/$branch"
          pr=$(gh pr list --repo "$REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            if ! url=$(gh pr create --repo "$REPOSITORY" --base main --head "$branch" \
                --title "Refresh the performance numbers" \
                --body "Generated by the Performance workflow from the results of ${SHA:0:12} (run ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). It changes only the Headline section of docs/performance.md."); then
              echo "::warning title=Performance::Could not open the pull request that refreshes docs/performance.md. Allow GitHub Actions to create pull requests (Settings, Actions, General), or merge the $branch branch by hand."
              exit 0
            fi
            pr=${url##*/}
          fi
          if ! gh pr merge "$pr" --repo "$REPOSITORY" --squash --delete-branch; then
            echo "::warning title=Performance::Could not merge pull request #$pr, which refreshes docs/performance.md."
          fi
      # Idle CPU after start-up on a large database, with clients connected, must stay under 3% of
      # one core (perf_compare.py's `large` section). It fails the job after the results are kept.
      - name: Check idle CPU on a large database
        if: steps.compare.outputs.gate != '0'
        env:
          GATE: ${{ steps.compare.outputs.gate }}
        run: |
          echo "::error title=Performance::perf_compare.py exited with $GATE: Rust's idle CPU on a large database with clients connected is over 3% of one core, or the comparison failed after writing its results. See the Compare both servers step."
          exit 1
