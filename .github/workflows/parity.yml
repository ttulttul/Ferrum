name: Server parity

on:
  pull_request:
    # A pull request that changes only docs/performance.md (the Performance workflow's own refresh,
    # opened by github-actions[bot]) creates no run. GitHub would otherwise create one and hold it
    # for approval before any job, so the job-level docs-only skip below could not report, and the
    # run would end red. No status check is required to merge, so this blocks nothing; other
    # docs-only pull requests still run and pass.
    paths-ignore:
      - "docs/performance.md"
  push:
    branches: [main]
  # Nightly: the whole matrix twice, to surface flaky tests, with the restart scenarios in real time
  # (see PARITY_REAL_TIME below).
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# A newer push to a pull request supersedes its running checks; main runs every push.
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A pull request, or a push to main, that changes only README.md or docs/ skips Rust validation
  # and the shards; the `parity` check still reports (and passes) so the pull request is not left
  # without it. The nightly run and manual runs always run everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Look for changes outside README.md and docs/
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Both sides of a rename count.
          files='.filename, (.previous_filename // empty)'
          case "$EVENT" in
            pull_request)
              gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --paginate \
                --jq ".[] | $files" > "$RUNNER_TEMP/files"
              ;;
            push)
              # Only a push that moves main forward from a commit it had is compared: a new branch
              # (an all-zero `before`), a force push, or a compare that lists its maximum of 300
              # files runs everything.
              status=$(gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --jq .status || true)
              if [ "$status" != ahead ]; then
                echo "Push not comparable to its previous commit (${status:-no answer}): running everything."
                echo "code=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --paginate \
                --jq ".files[] | $files" > "$RUNNER_TEMP/files"
              if [ "$(grep -c . "$RUNNER_TEMP/files")" -ge 300 ]; then
                echo "code=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          cat "$RUNNER_TEMP/files"
          if [ ! -s "$RUNNER_TEMP/files" ] || grep -qvE '^(README\.md|docs/.*)$' "$RUNNER_TEMP/files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only README.md and docs/ changed: skipping Rust validation and the parity shards."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: rust
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check every parity suite runs in one shard
        run: python3 scripts/check_parity_shards.py
      - name: Check the Performance workflow's daily gate
        run: scripts/perf_gate_test.sh
      - name: Fetch the pinned public reference
        run: |
          git init --quiet reference
          git -C reference fetch --depth=1 --no-recurse-submodules https://github.com/pingdotgg/t3code.git fd0331ca9b1596ed7018c80f52b7e6730014f593
          git -C reference checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-pnpm-12.14.0-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - name: Prepare the reference environment
        run: |
          npm install --global pnpm@12.14.0
          pnpm --dir reference --filter t3 --filter t3code-relay --filter @t3tools/client-runtime install --frozen-lockfile --prefer-offline
          # pnpm 12 completes the workspace install on the first `exec`; the reference does not
          # run without it (Cannot find package 'effect').
          pnpm --dir reference --filter t3 exec node --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity-validate
      - name: Check upstream inventory
        run: |
          python3 scripts/update_contract_inventory.py "$GITHUB_WORKSPACE/reference"
          git diff --exit-code -- contracts
          # The schema a fresh statev2.sqlite gets must be the pinned reference's.
          python3 scripts/update_statev2_schema.py "$GITHUB_WORKSPACE/reference" --check
          # Rust's agent tool definitions and docs/agent-tools.md must be the pinned reference's.
          python3 scripts/update_agent_tools.py "$GITHUB_WORKSPACE/reference" --check
          # The providers' capabilities must be the pinned reference adapters'.
          python3 scripts/update_provider_capabilities.py "$GITHUB_WORKSPACE/reference" --check
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          node scripts/settings_schema_cases.mjs reference > "$RUNNER_TEMP/settings-schema-cases.jsonl"
          T3_SETTINGS_SCHEMA_CASES="$RUNNER_TEMP/settings-schema-cases.jsonl" cargo test --locked upstream_schema_corpus -- --ignored
      - name: Build and test t3-agentd
        run: |
          cargo clippy --locked -p t3-agentd --all-targets -- -D warnings
          cargo test --locked -p t3-agentd
          cargo build --locked -p t3-agentd

  shard:
    name: parity shard
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # Each shard takes about 11 minutes on main; the rest is headroom for new scenarios.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # scripts/ci_parity_shard.sh lists each shard's suites. The thread shards are balanced by
        # each scenario's measured time (scripts/client_thread_parity_durations.json).
        shard: [thread-1-8, thread-2-8, thread-3-8, thread-4-8, thread-5-8, thread-6-8, thread-7-8, thread-8-8, core, integrations, integrations-2, status-1-2, status-2-2]
        # The nightly run runs every shard twice.
        round: ${{ fromJSON(github.event_name == 'schedule' && '[1, 2]' || '[1]') }}
        include:
          - shard: integrations
            browser: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned public reference
        run: |
          git init --quiet reference
          git -C reference fetch --depth=1 --no-recurse-submodules https://github.com/pingdotgg/t3code.git fd0331ca9b1596ed7018c80f52b7e6730014f593
          git -C reference checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      # Caches: the pnpm store (keyed on the reference's lockfile), the Playwright browsers it pins,
      # the libfaketime library (to skip `apt-get update`) and the Python environment.
      - name: Read cache keys
        id: keys
        run: |
          echo "python=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-pnpm-12.14.0-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - uses: actions/cache@v4
        if: matrix.browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - id: faketime
        uses: actions/cache@v4
        with:
          path: ~/.cache/libfaketime
          key: libfaketime-ubuntu-24.04
      - id: python
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-python
          key: parity-python-ubuntu-24.04-${{ steps.keys.outputs.python }}-${{ hashFiles('scripts/parity-requirements.txt') }}
      - name: Prepare the reference environment
        env:
          FAKETIME_CACHED: ${{ steps.faketime.outputs.cache-hit }}
          PYTHON_CACHED: ${{ steps.python.outputs.cache-hit }}
        run: |
          if [ "$FAKETIME_CACHED" != true ]; then
            sudo apt-get update -qq
            sudo apt-get install -y libfaketime
            mkdir -p ~/.cache/libfaketime
            cp /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1 ~/.cache/libfaketime/
          fi
          echo "FAKETIME_LIB=$HOME/.cache/libfaketime/libfaketime.so.1" >> "$GITHUB_ENV"
          npm install --global pnpm@12.14.0
          pnpm --dir reference --filter t3 --filter t3code-relay --filter @t3tools/client-runtime install --frozen-lockfile --prefer-offline
          # pnpm 12 completes the workspace install on the first `exec`; the reference does not
          # run without it (Cannot find package 'effect').
          pnpm --dir reference --filter t3 exec node --version
          if [ "$PYTHON_CACHED" != true ]; then
            python3 -m venv "$RUNNER_TEMP/parity-python"
            "$RUNNER_TEMP/parity-python/bin/pip" install -r scripts/parity-requirements.txt
          fi
          echo "$RUNNER_TEMP/parity-python/bin" >> "$GITHUB_PATH"
      # Its own step, so a stuck Ubuntu mirror fails it fast and retries instead of using up the job.
      - name: Install the test browser
        if: matrix.browser
        timeout-minutes: 8
        run: |
          # Downloads only the browser the cache does not have.
          pnpm --dir reference --filter t3 exec playwright-core install chromium
          shell_path=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)
          test -x "$shell_path"
          # The system libraries, only when the browser lacks some. apt gives up on a mirror that
          # stops answering, each try has 3 minutes, and a failed try is retried once.
          if ldd "$shell_path" | grep -q 'not found'; then
            printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
              | sudo tee /etc/apt/apt.conf.d/80-parity-timeouts > /dev/null
            for attempt in 1 2; do
              if timeout --kill-after=15 180 pnpm --dir reference --filter t3 exec playwright-core install-deps chromium; then
                break
              elif [ "$attempt" = 2 ]; then
                exit 1
              fi
              echo "::warning::Installing the browser's system libraries failed or timed out; trying again."
            done
          fi
          # Permit the installed test browser to start its user-namespace sandbox on Ubuntu.
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            "profile t3-parity-playwright \"$shell_path\" flags=(unconfined) { userns, }" \
            'profile t3-chrome-headless-shell /**/tools/chrome-headless-shell/*/*/chrome-headless-shell flags=(unconfined) { userns, }' \
            > "$RUNNER_TEMP/browser.apparmor"
          sudo install -m 644 "$RUNNER_TEMP/browser.apparmor" /etc/apparmor.d/t3-chrome-headless-shell
          sudo apparmor_parser -r /etc/apparmor.d/t3-chrome-headless-shell
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity-build
          # Every shard builds the same debug server; one of them saves the cache.
          save-if: ${{ matrix.shard == 'core' && matrix.round == 1 }}
      - name: Build the Rust server
        run: cargo build --locked
      - name: Compare both servers
        env:
          # Pull requests skip the restart scenarios' fixed waits (faketime moves the reference's
          # one-minute continuation retry on); main and the nightly run wait them out for real.
          PARITY_REAL_TIME: ${{ github.event_name == 'pull_request' && '0' || '1' }}
          PARITY_DIAGNOSTICS_PATH: ${{ runner.temp }}/agent-mcp-diff.txt
        run: scripts/ci_parity_shard.sh "${{ matrix.shard }}" "$GITHUB_WORKSPACE/reference" "$GITHUB_WORKSPACE/target/debug/t3code-server"
      - name: Upload parity diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.shard }}-${{ matrix.round }}-diagnostics
          path: ${{ runner.temp }}/agent-mcp-diff.txt
          if-no-files-found: ignore

  # One check that passes only when Rust validation and every shard passed.
  # A docs-only pull request or push passes it without them.
  parity:
    name: parity
    if: always()
    needs: [changes, rust, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Rust validation and every parity shard
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RUST: ${{ needs.rust.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), rust: $RUST, parity shards: $SHARDS"
          test "$CHANGES" = success
          if [ "$CODE" = false ]; then
            echo "Only README.md and docs/ changed; nothing to compare."
            exit 0
          fi
          test "$RUST" = success && test "$SHARDS" = success
