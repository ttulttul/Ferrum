name: Server parity

on:
  pull_request:
  push:
    branches: [main]
  # Nightly, the restart scenarios also run in real time (see PARITY_REAL_TIME below).
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# A newer push to a pull request supersedes its running checks; main runs every push.
concurrency:
  group: parity-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check every parity suite runs in one shard
        run: python3 scripts/check_parity_shards.py
      - name: Fetch the pinned public reference
        run: |
          git init --quiet reference
          git -C reference fetch --depth=1 --no-recurse-submodules https://github.com/pingdotgg/t3code.git 052ca497cf1103b001327bcd964188a71dfec213
          git -C reference checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-pnpm-12.14.0-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - name: Prepare the reference environment
        run: |
          npm install --global pnpm@12.14.0
          pnpm --dir reference --filter t3 --filter t3code-relay --filter @t3tools/client-runtime install --frozen-lockfile --prefer-offline
          # pnpm 12 completes the workspace install on the first `exec`; the reference does not
          # run without it (Cannot find package 'effect').
          pnpm --dir reference --filter t3 exec node --version
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity-validate
      - name: Check upstream inventory
        run: |
          python3 scripts/update_contract_inventory.py "$GITHUB_WORKSPACE/reference"
          git diff --exit-code -- contracts
      - name: Validate Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked
          node scripts/settings_schema_cases.mjs reference > "$RUNNER_TEMP/settings-schema-cases.jsonl"
          T3_SETTINGS_SCHEMA_CASES="$RUNNER_TEMP/settings-schema-cases.jsonl" cargo test --locked upstream_schema_corpus -- --ignored
      - name: Build and test t3-agentd
        run: |
          cargo clippy --locked -p t3-agentd --all-targets -- -D warnings
          cargo test --locked -p t3-agentd
          cargo build --locked -p t3-agentd

  shard:
    name: parity (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # scripts/ci_parity_shard.sh lists each shard's suites.
        include:
          - shard: thread-1-3
          - shard: thread-2-3
          - shard: thread-3-3
          - shard: core
          - shard: integrations
            browser: true
          - shard: relay-provisioning
          - shard: provider-status
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned public reference
        run: |
          git init --quiet reference
          git -C reference fetch --depth=1 --no-recurse-submodules https://github.com/pingdotgg/t3code.git 052ca497cf1103b001327bcd964188a71dfec213
          git -C reference checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      # Caches: the pnpm store (keyed on the reference's lockfile), the Playwright browsers it pins,
      # the libfaketime library (to skip `apt-get update`) and the Python environment.
      - name: Read cache keys
        id: keys
        run: |
          echo "python=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-pnpm-12.14.0-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - uses: actions/cache@v4
        if: matrix.browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('reference/pnpm-lock.yaml') }}
      - id: faketime
        uses: actions/cache@v4
        with:
          path: ~/.cache/libfaketime
          key: libfaketime-ubuntu-24.04
      - id: python
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/parity-python
          key: parity-python-ubuntu-24.04-${{ steps.keys.outputs.python }}-${{ hashFiles('scripts/parity-requirements.txt') }}
      - name: Prepare the reference environment
        env:
          BROWSER: ${{ matrix.browser }}
          FAKETIME_CACHED: ${{ steps.faketime.outputs.cache-hit }}
          PYTHON_CACHED: ${{ steps.python.outputs.cache-hit }}
        run: |
          if [ "$FAKETIME_CACHED" != true ]; then
            sudo apt-get update -qq
            sudo apt-get install -y libfaketime
            mkdir -p ~/.cache/libfaketime
            cp /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1 ~/.cache/libfaketime/
          fi
          echo "FAKETIME_LIB=$HOME/.cache/libfaketime/libfaketime.so.1" >> "$GITHUB_ENV"
          npm install --global pnpm@12.14.0
          pnpm --dir reference --filter t3 --filter t3code-relay --filter @t3tools/client-runtime install --frozen-lockfile --prefer-offline
          # pnpm 12 completes the workspace install on the first `exec`; the reference does not
          # run without it (Cannot find package 'effect').
          pnpm --dir reference --filter t3 exec node --version
          if [ "$BROWSER" = true ]; then
            # Downloads only the browsers the cache does not have; the system libraries always.
            pnpm --dir reference --filter t3 exec playwright-core install --with-deps chromium
            # Permit the installed test browser to start its user-namespace sandbox on Ubuntu.
            shell_path=$(find "$HOME/.cache/ms-playwright" -type f -name chrome-headless-shell -print -quit)
            test -x "$shell_path"
            printf '%s\n' \
              'abi <abi/4.0>,' \
              'include <tunables/global>' \
              "profile t3-parity-playwright \"$shell_path\" flags=(unconfined) { userns, }" \
              'profile t3-chrome-headless-shell /**/tools/chrome-headless-shell/*/*/chrome-headless-shell flags=(unconfined) { userns, }' \
              > "$RUNNER_TEMP/browser.apparmor"
            sudo install -m 644 "$RUNNER_TEMP/browser.apparmor" /etc/apparmor.d/t3-chrome-headless-shell
            sudo apparmor_parser -r /etc/apparmor.d/t3-chrome-headless-shell
          fi
          if [ "$PYTHON_CACHED" != true ]; then
            python3 -m venv "$RUNNER_TEMP/parity-python"
            "$RUNNER_TEMP/parity-python/bin/pip" install -r scripts/parity-requirements.txt
          fi
          echo "$RUNNER_TEMP/parity-python/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: parity-build
          # Every shard builds the same debug server; one of them saves the cache.
          save-if: ${{ matrix.shard == 'core' }}
      - name: Build the Rust server
        run: cargo build --locked
      - name: Compare both servers
        env:
          # Pull requests skip the restart scenarios' fixed waits (faketime moves the reference's
          # one-minute continuation retry on); main and the nightly run wait them out for real.
          PARITY_REAL_TIME: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: scripts/ci_parity_shard.sh "${{ matrix.shard }}" "$GITHUB_WORKSPACE/reference" "$GITHUB_WORKSPACE/target/debug/t3code-server"

  # One check that passes only when Rust validation and every shard passed.
  parity:
    name: parity
    if: always()
    needs: [rust, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Rust validation and every parity shard
        env:
          RUST: ${{ needs.rust.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "rust: $RUST, parity shards: $SHARDS"
          test "$RUST" = success && test "$SHARDS" = success
