name: Workers control plane

on:
  pull_request:
    # A pull request that changes only docs/performance.md (the Performance workflow's own refresh,
    # opened by github-actions[bot]) creates no run. GitHub would otherwise create one and hold it
    # for approval before any job, so the job-level docs-only skip below could not report, and the
    # run would end red. No status check is required to merge, so this blocks nothing; other
    # docs-only pull requests still run and pass.
    paths-ignore:
      - "docs/performance.md"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A pull request, or a push to main, that changes only README.md or docs/ skips the build; the
  # `workers` check still reports (and passes).
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - name: Look for changes outside README.md and docs/
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # Both sides of a rename count.
          files='.filename, (.previous_filename // empty)'
          case "$EVENT" in
            pull_request)
              gh api "repos/$REPOSITORY/pulls/$PULL_REQUEST/files" --paginate \
                --jq ".[] | $files" > "$RUNNER_TEMP/files"
              ;;
            push)
              # Only a push that moves main forward from a commit it had is compared: a new branch
              # (an all-zero `before`), a force push, or a compare that lists its maximum of 300
              # files runs everything.
              status=$(gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --jq .status || true)
              if [ "$status" != ahead ]; then
                echo "Push not comparable to its previous commit (${status:-no answer}): running everything."
                echo "code=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              gh api "repos/$REPOSITORY/compare/$BEFORE...$AFTER" --paginate \
                --jq ".files[] | $files" > "$RUNNER_TEMP/files"
              if [ "$(grep -c . "$RUNNER_TEMP/files")" -ge 300 ]; then
                echo "code=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            *)
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          cat "$RUNNER_TEMP/files"
          if [ ! -s "$RUNNER_TEMP/files" ] || grep -qvE '^(README\.md|docs/.*)$' "$RUNNER_TEMP/files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only README.md and docs/ changed: skipping the workers build and parity suites."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: workers build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the wasm32 target and worker-build
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install --locked worker-build@0.9.0
      - name: Check the workers feature for wasm32
        run: |
          cargo check --locked --no-default-features --features workers --target wasm32-unknown-unknown
          cargo clippy --locked --no-default-features --features workers --target wasm32-unknown-unknown -- -D warnings
      - name: Build the WebAssembly entry point
        working-directory: workers
        run: |
          worker-build --release
          ls -l build
          gzip -9 -c build/index_bg.wasm | wc -c | xargs -I{} echo "wasm gzip bytes: {}"
      - name: Fetch the pinned public reference
        run: |
          git init --quiet reference
          git -C reference fetch --depth=1 --no-recurse-submodules https://github.com/pingdotgg/t3code.git fd0331ca9b1596ed7018c80f52b7e6730014f593
          git -C reference checkout --quiet --detach FETCH_HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
      - name: Prepare the reference client runtime
        run: |
          npm install --global pnpm@12.14.0
          pnpm --dir reference --filter "@t3tools/client-runtime..." install --frozen-lockfile
          python3 -m venv "$RUNNER_TEMP/parity-python"
          "$RUNNER_TEMP/parity-python/bin/pip" install websockets==16.0 cryptography
          echo "$RUNNER_TEMP/parity-python/bin" >> "$GITHUB_PATH"
      - name: Compare the WebAssembly build's initial sync with native
        run: |
          cargo build --locked
          python3 scripts/workers_initial_sync_parity.py \
            --rust-command "$GITHUB_WORKSPACE/target/debug/t3code-server" \
            --reference-root "$GITHUB_WORKSPACE/reference" \
            --wrangler "npx --yes wrangler@4.166.0"
      - name: Link to the WebAssembly build as the reference links another machine
        run: |
          python3 scripts/workers_peer_link_parity.py \
            --rust-command "$GITHUB_WORKSPACE/target/debug/t3code-server" \
            --reference-root "$GITHUB_WORKSPACE/reference" \
            --wrangler "npx --yes wrangler@4.166.0"

  workers:
    name: workers
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the workers build, or report a docs-only skip
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "changes: $CHANGES (code: $CODE), workers build: $BUILD"
          test "$CHANGES" = success
          if [ "$CODE" = false ]; then
            echo "Only README.md and docs/ changed; nothing to build."
            exit 0
          fi
          test "$BUILD" = success
