fragment IssueDetailFields on Issue {
  __typename
  ...IssueRow
  assignees(first: 100) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      login
      name
      avatarUrl
    }
  }
  labels(first: 100) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      name
      color
    }
  }
  body
  viewerCanUpdate
  viewerCanClose
  viewerCanReopen
  ...Reactions
  comments(last: 100) {
    totalCount
    pageInfo {
      hasPreviousPage
      startCursor
    }
    nodes {
      id
      author {
        login
        avatarUrl
      }
      body
      createdAt
      url
      ...Reactions
    }
  }
  closedByPullRequestsReferences(first: 20, includeClosedPrs: true) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      number
      title
      url
      state
      isDraft
      repository {
        nameWithOwner
      }
    }
  }
  timelineItems(
    last: 100
    itemTypes: [
      CLOSED_EVENT
      REOPENED_EVENT
      LABELED_EVENT
      UNLABELED_EVENT
      ASSIGNED_EVENT
      UNASSIGNED_EVENT
      RENAMED_TITLE_EVENT
      CROSS_REFERENCED_EVENT
    ]
  ) {
    nodes {
      __typename
      ... on ClosedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
      }
      ... on ReopenedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
      }
      ... on LabeledEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        label {
          name
        }
      }
      ... on UnlabeledEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        label {
          name
        }
      }
      ... on AssignedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        assignee {
          ... on User {
            login
            name
          }
          ... on Bot {
            login
          }
        }
      }
      ... on UnassignedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        assignee {
          ... on User {
            login
            name
          }
          ... on Bot {
            login
          }
        }
      }
      ... on RenamedTitleEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        currentTitle
      }
      ... on CrossReferencedEvent {
        id
        createdAt
        actor {
          login
          avatarUrl
        }
        source {
          __typename
          ... on PullRequest {
            number
            title
            url
            state
            isDraft
            repository {
              nameWithOwner
            }
          }
          ... on Issue {
            number
            repository {
              nameWithOwner
            }
          }
        }
      }
    }
  }
}

fragment IssueRow on Issue {
  number
  title
  url
  state
  stateReason
  createdAt
  updatedAt
  closedAt
  author {
    login
    avatarUrl
    ... on User {
      name
    }
  }
}

fragment Reactions on Reactable {
  reactionGroups {
    content
    viewerHasReacted
    reactors(first: 10) {
      totalCount
      nodes {
        ... on User {
          login
        }
        ... on Bot {
          login
        }
        ... on Organization {
          login
        }
        ... on Mannequin {
          login
        }
      }
    }
  }
}
