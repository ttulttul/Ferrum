query IssueComments($owner: String!, $name: String!, $number: Int!, $cursor: String!) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    issue(number: $number) {
      comments(last: 100, before: $cursor) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          author {
            login
            avatarUrl
          }
          body
          createdAt
          url
          ...Reactions
        }
      }
    }
  }
}

fragment Reactions on Reactable {
  reactionGroups {
    content
    viewerHasReacted
    reactors(first: 10) {
      totalCount
      nodes {
        ... on User {
          login
        }
        ... on Bot {
          login
        }
        ... on Organization {
          login
        }
        ... on Mannequin {
          login
        }
      }
    }
  }
}
