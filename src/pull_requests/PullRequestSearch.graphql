query PullRequestSearch(
  $q: String!
  $first: Int!
  $after: String
  $stacks: Boolean!
  $stats: Boolean!
) {
  search(query: $q, type: ISSUE, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...PullRequestRow
    }
  }
}

fragment PullRequestRow on PullRequest {
  stack @include(if: $stacks) {
    number
    size
    baseRefName
  }
  stackEntry @include(if: $stacks) {
    position
  }
  number
  title
  url
  author {
      __typename
    login
    avatarUrl
    ... on User {
      name
    }
  }
  headRefName
  baseRefName
  state
  isDraft
  mergeable
  reviewDecision
  latestReviews(first: 20) {
    nodes {
      state
      isMinimized
      author {
      __typename
        login
      }
    }
  }
  additions @include(if: $stats)
  deletions @include(if: $stats)
  createdAt
  updatedAt
  mergedAt
  repository {
    nameWithOwner
  }
  reviewRequests(first: 20) {
    nodes {
      requestedReviewer {
        ... on User {
          login
        }
        ... on Team {
          slug
        }
      }
    }
  }
  labels(first: 20) {
    nodes {
      name
      color
      description
    }
  }
  # GitHub's rollup for the head commit, one enum, rather than the whole check list: measured at a
  # hundred rows, 0.8s -> 3.0s and 15 KB, against 425 KB for the same verdict as a check array.
  commits(last: 1) {
    nodes {
      commit {
        statusCheckRollup {
          state
        }
      }
    }
  }
}
