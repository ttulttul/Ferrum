query ReviewThreadComments(
  $owner: String!
  $name: String!
  $number: Int!
  $threadId: ID!
  $after: String
) {
  viewer {
    login
  }
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      id
    }
  }
  node(id: $threadId) {
    __typename
    ... on PullRequestReviewThread {
      pullRequest {
        id
      }
      comments(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ThreadComment
        }
      }
    }
  }
}

fragment ThreadComment on PullRequestReviewComment {
  id
  author {
    __typename
    login
    avatarUrl
  }
  body
  createdAt
  lastEditedAt
  url
  isMinimized
  # A review link names the review, not its comments; this lets it find the comments it posted.
  pullRequestReview {
    url
  }
  ...Reactions
}

fragment Reactions on Reactable {
  reactionGroups {
    content
    viewerHasReacted
    reactors(first: 10) {
      totalCount
      nodes {
        ... on User {
          login
        }
        ... on Bot {
          login
        }
        ... on Organization {
          login
        }
        ... on Mannequin {
          login
        }
      }
    }
  }
}
